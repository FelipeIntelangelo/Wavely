<form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="form-wrapper">
    <div class="form-container">
        <p class="title">Iniciar Sesión</p>
        
        <div class="input-group">
            <label for="usernameIn">Usuario</label>
            <input type="text" id="usernameIn" formControlName="username"
            [class.error-input]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
            <app-form-error controlName="username" [customMessages]="customErrors['username']" />
        </div>
        
        <div class="input-group">
            <label for="passwordIn">Contraseña</label>
            <div class="password-input-wrapper">
                <input [type]="showPassword ? 'text' : 'password'" id="passwordIn" formControlName="password"
                [class.error-input]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
                    <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                </button>
            </div>
            <app-form-error controlName="password" [customMessages]="customErrors['password']" />
        </div>

        <button type="submit" class="sign" [disabled]="loginForm.invalid">Ingresar</button>
        
        <p class="error-message" [class.show]="!!errorMessage">
            {{ errorMessage }}
            @if (errorCheck) {
                <span id="error-span">{{errorCheck}}</span>
            }
        </p>

        <div class="social-message">
            <div class="line"></div>
            <p class="message">o ingresá con tu cuenta de Google</p>
            <div class="line"></div>
        </div>

        <!-- Botón de Google Sign-In -->
        <div class="google-btn-container">
            <p class="google-loading" [class.show]="googleLoading">Iniciando sesión con Google...</p>
            <div id="google-signin-btn"></div>
        </div>

        @if (isModal) {
            <p class="signup">¿No tenés cuenta? <a href="#" (click)="$event.preventDefault(); switchRegister.emit()" id="registerRoute">Registrate</a></p>
        } @else {
            <p class="signup">¿No tenés cuenta? <a routerLink="/auth/register" id="registerRoute">Registrate</a></p>
        }
    </div>
</form>
