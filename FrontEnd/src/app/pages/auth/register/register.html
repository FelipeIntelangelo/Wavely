<form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="form-wrapper">
    <div class="form-container">
        <p class="title">Sign Up</p>
        <p class="subtitle">Signup now and get full access to our web</p>
        
        @if (currentStep === 1) {
            <!-- Fila 1: Name y Last Name -->
            <div class="form-row">
                <div class="input-group">
                    <label for="nameIn">Name <span class="required-asterisk">*</span></label>
                    <input type="text" id="nameIn" formControlName="name"
                    [class.error-input]="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
                    <app-form-error controlName="name" [customMessages]="customErrors['name']" />
                </div>
                
                <div class="input-group">
                    <label for="lastNameIn">Last Name <span class="required-asterisk">*</span></label>
                    <input type="text" id="lastNameIn" formControlName="lastName"
                    [class.error-input]="registerForm.get('lastName')?.invalid && registerForm.get('lastName')?.touched">
                    <app-form-error controlName="lastName" [customMessages]="customErrors['lastName']" />
                </div>
            </div>
            
            <div class="input-group">
                <label for="nicknameIn">Nickname <span class="required-asterisk">*</span></label>
                <input type="text" id="nicknameIn" formControlName="nickname"
                [class.error-input]="registerForm.get('nickname')?.invalid && registerForm.get('nickname')?.touched">
                <app-form-error controlName="nickname" [customMessages]="customErrors['nickname']" />
            </div>

            <button type="button" class="sign" [disabled]="isSubmitting || 
                !registerForm.get('name')?.valid
                || !registerForm.get('lastName')?.valid
                || !registerForm.get('nickname')?.valid"
                (click)="nextStep()">Next Step</button>
                
            @if (isModal) {
                <p class="signup">Have an account? <a href="#" (click)="$event.preventDefault(); switchLogin.emit()" id="loginRoute">Sign in</a></p>
            } @else {
                <p class="signup">Have an account? <a routerLink="/auth/login" id="loginRoute">Sign in</a></p>
            }
        } @else if (currentStep === 2) {
            <div class="input-group">
                <label for="emailIn">Email <span class="required-asterisk">*</span></label>
                <input type="email" id="emailIn" formControlName="email"
                [class.error-input]="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
                <app-form-error controlName="email" [customMessages]="customErrors['email']"/>
            </div>

            <div class="input-group">
                <label for="usernameIn">Username <span class="required-asterisk">*</span></label>
                <input type="text" id="usernameIn" formControlName="username"
                [class.error-input]="registerForm.get('username')?.invalid && registerForm.get('username')?.touched">
                <app-form-error controlName="username" [customMessages]="customErrors['username']" />
            </div>
            
            <div class="input-group">
                <label for="passwordIn">Password <span class="required-asterisk">*</span></label>
                <div class="password-input-wrapper">
                    <input [type]="showPassword ? 'text' : 'password'" id="passwordIn" formControlName="password"
                    [class.error-input]="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
                    <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
                        <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <app-form-error controlName="password" [customMessages]="customErrors['password']" />
            </div>

            <div class="input-group">
                <label for="confirmPasswordIn">Retype Password <span class="required-asterisk">*</span></label>
                <div class="password-input-wrapper">
                    <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPasswordIn" formControlName="confirmPassword"
                    [class.error-input]="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched">
                    <button type="button" class="password-toggle" (click)="toggleConfirmPasswordVisibility()" tabindex="-1">
                        <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
                    </button>
                </div>
                <app-form-error controlName="confirmPassword" [customMessages]="customErrors['confirmPassword']" />
            </div>

            <div class="step-buttons">
                <button type="button" class="back-btn" (click)="prevStep()">Back</button>
                <button type="submit" class="sign submit-btn" [disabled]="isSubmitting">
                    {{ isSubmitting ? 'Registering...' : 'Register' }}
                </button>
            </div>
            
            <div class="spinner-container" [class.show]="isSubmitting">
                <span class="spinner" aria-hidden="true"></span>
            </div>

            <p class="error-message" [class.show]="!!errorMessage">{{ errorMessage }}</p>
            
            @if (isModal) {
                <p class="signup">Have an account? <a href="#" (click)="$event.preventDefault(); switchLogin.emit()" id="loginRoute">Sign in</a></p>
            } @else {
                <p class="signup">Have an account? <a routerLink="/auth/login" id="loginRoute">Sign in</a></p>
            }
        }
    </div>
</form>
