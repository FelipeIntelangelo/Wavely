<div class="profile-container">
  @if (isLoading) {
    <div class="loading-spinner">Loading profile...</div>
  }

  <div class="error-message" [class.show]="!!error">{{ error }}</div>

  @if (currentUser) {
    @if (isGoogleUser) {
      <div class="google-user-notice">
        <i class="fab fa-google"></i>
        <span>Iniciaste sesión con Google. Podés modificar tu información de perfil. Los campos de seguridad (email y contraseña) están gestionados por Google.</span>
      </div>
    }
    <form [formGroup]="editProfileForm" (ngSubmit)="onSave()" class="edit-profile-form">
      <div class="edit-profile-grid">
        <!-- Columna Izquierda: Información de Perfil -->
        <div class="edit-profile-column">
          <div class="profile-header">
            <!-- Columna de Foto -->
            <div class="profile-picture-column">
              <div class="profile-picture-wrapper" (click)="profilePictureUpload.triggerFileSelect()" style="cursor: pointer;">
                <app-media-image [src]="editProfileForm.get('profilePicture')?.value" [alt]="currentUser.nickname || 'Profile Picture'" type="user" customClass="profile-picture"></app-media-image>
                <div class="profile-picture-overlay">
                  <i class="fas fa-pencil-alt"></i>
                </div>
              </div>
              <app-cloudinary-upload
                style="display: none;"
                acceptedTypes="image/*"
                resourceType="image"
                label="Subir imagen"
                [maxSizeMB]="5"
                [defer]="true"
                #profilePictureUpload
                (fileSelected)="onFileSelected($event)"
                (uploadComplete)="onImageUploaded($event)"
                (uploadError)="onUploadError($event)">
              </app-cloudinary-upload>
            </div>

            <!-- Nickname, Name y Last Name -->
            <div class="profile-name-section">
              <div class="form-group">
                <label for="nickname">Nickname</label>
                <input type="text" id="nickname" formControlName="nickname"
                       [class.error-input]="editProfileForm.get('nickname')?.invalid && editProfileForm.get('nickname')?.touched">
                <app-form-error controlName="nickname" [customMessages]="customErrors['nickname']"></app-form-error>
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="name">Nombre</label>
                  <input type="text" id="name" formControlName="name"
                         [class.error-input]="editProfileForm.get('name')?.invalid && editProfileForm.get('name')?.touched">
                  <app-form-error controlName="name" [customMessages]="customErrors['name']"></app-form-error>
                </div>

                <div class="form-group">
                  <label for="lastName">Apellido</label>
                  <input type="text" id="lastName" formControlName="lastName"
                         [class.error-input]="editProfileForm.get('lastName')?.invalid && editProfileForm.get('lastName')?.touched">
                  <app-form-error controlName="lastName" [customMessages]="customErrors['lastName']"></app-form-error>
                </div>
              </div>
            </div>
          </div>

          <!-- Bio -->
          <div class="form-group">
            <label for="bio">Bio</label>
            <textarea id="bio" formControlName="bio" style="resize: none;" rows="5"
                      [class.error-input]="editProfileForm.get('bio')?.invalid && editProfileForm.get('bio')?.touched"></textarea>
            <app-form-error controlName="bio" [customMessages]="customErrors['bio']"></app-form-error>
          </div>

          <div class="form-actions desktop-only-actions">
            <button type="submit" [disabled]="editProfileForm.invalid">Save Changes</button>
            <button type="button" (click)="onCancel()">Cancel</button>
          </div>
        </div>

        <!-- Columna Derecha: Credenciales y Seguridad -->
        <div class="edit-profile-column">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" formControlName="email"
                   [class.disabled-input]="isGoogleUser"
                   [class.error-input]="editProfileForm.get('email')?.invalid && editProfileForm.get('email')?.touched">
            <app-form-error controlName="email" [customMessages]="customErrors['email']"></app-form-error>
          </div>

          <div class="form-group">
            <label for="password">Nueva Contraseña (opcional)</label>
            <div class="password-input-wrapper">
              <input [type]="showPassword ? 'text' : 'password'" id="password" formControlName="password"
                     [class.disabled-input]="isGoogleUser"
                     [class.error-input]="editProfileForm.get('password')?.invalid && editProfileForm.get('password')?.touched">
              <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1" [disabled]="isGoogleUser">
                <i [class]="showPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
            <app-form-error controlName="password" [customMessages]="customErrors['password']"></app-form-error>
          </div>

          <div class="form-group">
            <label for="confirmPassword">Confirmar Nueva Contraseña</label>
            <div class="password-input-wrapper">
              <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirmPassword" formControlName="confirmPassword"
                     [class.disabled-input]="isGoogleUser"
                     [class.error-input]="editProfileForm.get('confirmPassword')?.invalid && editProfileForm.get('confirmPassword')?.touched">
              <button type="button" class="password-toggle" (click)="toggleConfirmPasswordVisibility()" tabindex="-1" [disabled]="isGoogleUser">
                <i [class]="showConfirmPassword ? 'fas fa-eye-slash' : 'fas fa-eye'"></i>
              </button>
            </div>
            <app-form-error controlName="confirmPassword" [customMessages]="customErrors['confirmPassword']"></app-form-error>
          </div>
        </div>
      </div>

      <!-- Botones para vista Mobile/Tablet (Debajo de todos los inputs) -->
      <div class="form-actions mobile-only-actions">
        <button type="submit" [disabled]="editProfileForm.invalid">Save Changes</button>
        <button type="button" (click)="onCancel()">Cancel</button>
      </div>
    </form>
  }
</div>

@if (showCropperModal) {
  <app-image-cropper-modal
    [imageFile]="fileToCrop"
    (cropComplete)="onCropCompleted($event)"
    (cropCancel)="onCropCancelled()"
  ></app-image-cropper-modal>
}
